
[package]
name = "flate2-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flate2 = { path = ".." }
miniz_oxide = "0.9.0"

[features]
fdeflate = ["flate2/fdeflate"]

[patch."https://github.com/Shnatsel/fdeflate.git"]
fdeflate = { path = "../fdeflate" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_gz_roundtrip"
path = "fuzz_targets/fuzz_gz_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "streaming"
path = "fuzz_targets/streaming.rs"
test = false
doc = false
