name: Release-plz

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      pull-requests: write # Required for release-plz to open a release PR
      contents: write # Required for release-plz to push a tag
      id-token: write # Required for OIDC exchange
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (rustup)
        run: rustup update stable --no-self-update && rustup default stable
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
